on:
  push:
    branches:
    - main
    paths:
    - 'docs/dokka/**'

jobs:
  build:
    name: Build API Docs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Upload
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/dokka/
  deploy:
    name: Deploy API Docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      uses: actions/deploy-pages@v4
